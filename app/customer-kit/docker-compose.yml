# Tracker — customer installation. See INSTALL.md.
#   Your own PostgreSQL:     docker compose up -d
#   Bundled PostgreSQL too:  docker compose --profile postgres up -d
services:
  tracker:
    image: ${TRACKER_IMAGE:?set TRACKER_IMAGE in .env (from your Tracker supplier)}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${TRACKER_PORT:-4000}:4000"
    volumes:
      - tracker-data:/app/data   # uploaded attachments (and the embedded database if no DATABASE_URL is set)
    depends_on:
      db:
        condition: service_healthy
        required: false

  # optional: only started with --profile postgres
  db:
    profiles: ["postgres"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tracker-data:
  pgdata:
